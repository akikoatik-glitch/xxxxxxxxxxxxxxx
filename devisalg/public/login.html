<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DevisAlg</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body style="background:linear-gradient(135deg,#7c3aed,#0ea5e9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="max-width:400px;width:100%;padding:28px">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:34px;font-weight:800;color:var(--brand)">DevisAlg</div>
      <div class="muted small">Gérez devis, factures et clients — avec un assistant IA en Darija 🇩🇿</div>
    </div>
    <div id="err" style="display:none;background:var(--red-soft);color:var(--red);padding:10px;border-radius:8px;margin-bottom:12px"></div>
    <form onsubmit="doLogin(event)">
      <div class="field"><label>Email</label><input id="email" class="input" type="email" required></div>
      <div class="field"><label>Mot de passe</label><input id="password" class="input" type="password" required></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Se connecter</button>
    </form>
    <div class="small muted" style="text-align:center;margin-top:16px">Pas de compte ?
      <a href="/register.html" style="color:var(--brand);font-weight:600">Créer un compte gratuit</a>
    </div>
  </div>
  <script>
  async function doLogin(e){
    e.preventDefault();
    const err=document.getElementById('err');
    err.style.display='none';
    try{
      const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||'Erreur');
      location.href='/app/dashboard';
    }catch(x){err.textContent=x.message;err.style.display='block';}
  }
  </script>
</body>
</html>
