name: Auto predictions update (every 2 hours)

on:
  schedule:
    # Every 2 hours: 00:00, 02:00, 04:00, ... UTC
    - cron: '0 */2 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

# Avoid running two scheduled workflows at the same minute (rate-limit safety).
concurrency:
  group: predictions-update
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch football data
        run: node scripts/fetch_football.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Build site
        run: node scripts/sitegen.js

      - name: Verify build
        run: node scripts/verify.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — predictions unchanged since last run."
            exit 0
          fi
          git commit -m "Auto predictions update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
