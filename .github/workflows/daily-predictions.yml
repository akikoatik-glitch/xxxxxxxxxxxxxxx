name: Auto predictions update (every 2 hours) — LEGACY, disabled

on:
  # Disabled by removing the schedule trigger; left here for reference.
  # The canonical every-2-hours workflow is daily.yml.
  workflow_dispatch:  # allow manual trigger only
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-predictions.yml'

permissions:
  contents: write

jobs:
  update-predictions:
    # Pin to Ubuntu 22.04 — ubuntu-latest now points to 24.04 which
    # ships Node 22 by default and breaks our sitegen.js.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Print environment
        run: |
          echo "Node: $(node --version 2>&1 || echo 'NOT FOUND')"
          echo "npm:  $(npm --version 2>&1 || echo 'NOT FOUND')"
          echo "Date: $(date -u)"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build deps (tailwindcss/postcss for build_css.js)
        run: npm install --no-audit --no-fund

      - name: Fetch football data
        run: node scripts/fetch_football.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Build site (HTML + CSS)
        run: |
          node scripts/sitegen.js
          node scripts/build_css.js

      - name: Verify build
        run: node scripts/verify.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — predictions unchanged since last run."
            exit 0
          fi
          git commit -m "Auto predictions update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
