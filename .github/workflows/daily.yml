name: Auto football predictions + news (every 2 hours)
on:
  schedule:
    # Every 2 hours, on the hour (UTC). Offset by 1 minute from the other workflow
    # so they don't collide if both are scheduled.
    - cron: '1 */2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily.yml'

# Don't run both scheduled workflows at the exact same minute.
concurrency:
  group: predictions-update
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch football data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch_football.js

      - name: Fetch news
        run: node scripts/fetch_news.js

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Build site
        run: |
          node scripts/sitegen.js
          node scripts/build_css.js

      - name: Re-thin sitemap and verify
        run: |
          node scripts/mark_thin_noindex.js
          node scripts/fix_match_schema.js
          node scripts/thin_sitemap.js
          node scripts/verify.js

      - name: Commit updated data
        run: |
          git config user.name "xwhiz-bot"
          git config user.email "bot@xwhiz.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — site unchanged since last run."
            exit 0
          fi
          git commit -m "Auto prediction update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
