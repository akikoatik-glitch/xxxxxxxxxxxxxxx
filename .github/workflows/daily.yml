name: Auto football predictions + news (every 2 hours)
on:
  schedule:
    # Every 2 hours, on the hour (UTC). Offset by 1 minute from the other workflow
    # so they don't collide if both are scheduled.
    - cron: '1 */2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily.yml'

# Don't run both scheduled workflows at the exact same minute.
concurrency:
  group: predictions-update
  cancel-in-progress: false

jobs:
  predict:
    # Pin to Ubuntu 22.04 — ubuntu-latest now points to 24.04 which
    # ships Node 22 by default and breaks our sitegen.js.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Print environment
        run: |
          echo "Node: $(node --version 2>&1 || echo 'NOT FOUND')"
          echo "npm:  $(npm --version 2>&1 || echo 'NOT FOUND')"
          echo "OS:   $(uname -a)"
          echo "Date: $(date -u)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build deps (tailwindcss/postcss for build_css.js)
        run: npm install --no-audit --no-fund

      - name: Fetch football data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch_football.js

      - name: Fetch news
        run: node scripts/fetch_news.js

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Build HTML (sitegen)
        run: node scripts/sitegen.js

      - name: Build CSS (tailwind compile)
        run: node scripts/build_css.js

      - name: Mark thin pages noindex
        run: node scripts/mark_thin_noindex.js

      - name: Fix SportsEvent organizer on match pages
        run: node scripts/fix_match_schema.js

      - name: Rebuild thin sitemap
        run: node scripts/thin_sitemap.js

      - name: Verify build
        run: node scripts/verify.js

      - name: Commit updated data
        run: |
          git config user.name "xwhiz-bot"
          git config user.email "bot@xwhiz.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — site unchanged since last run."
            exit 0
          fi
          git commit -m "Auto prediction update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
