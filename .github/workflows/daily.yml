name: Daily football predictions
on:
  schedule:
    # Run every day at 03:00 UTC (06:00 CET / Algiers)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily.yml'

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch football data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch_football.js

      - name: Fetch news
        run: node scripts/fetch_news.js

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Build site
        run: |
          node scripts/sitegen.js
          node scripts/build_css.js

      - name: Verify
        run: node scripts/verify.js

      - name: Commit updated data
        run: |
          git config user.name "xwhiz-bot"
          git config user.email "bot@xwhiz.com"
          git add -A
          # Only commit if something changed
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily prediction update $(date -u +%Y-%m-%d)"
          git push origin main
